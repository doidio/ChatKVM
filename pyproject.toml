[project]
name = "chatkvm"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [
    { name = "sjtu_6547", email = "88172828@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.2.0",
    "pillow>=12.0.0",
    "pydantic-ai-slim[openai]>=2.0.0",
    "streamlit>=1.64.0",
    "tomlkit>=0.15.1",
]

[project.scripts]
chatkvm = "chatkvm:main"

[project.optional-dependencies]
voice = ["funasr", "modelscope", "torch", "torchaudio", "soundfile", "transformers>=4.51,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 150

[tool.ruff.format]
quote-style = "single"
